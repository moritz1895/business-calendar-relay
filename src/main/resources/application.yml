spring:
  application:
    name: business-calendar-relay
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  datasource:
    url: jdbc:h2:file:${STATE_STORE_DATA_DIR:./data}/relay-state
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health

relay:
  poll-interval: ${RELAY_POLL_INTERVAL:5m}
  # `recurring-event-horizon` bounds how far into the future a recurring source event's
  # occurrence may start and still be eligible for its first blocker creation; it is a
  # single value shared across every configured calendar, like `poll-interval` above,
  # not a per-calendar setting. Defaults to `P6M` (6 months) when omitted.
  # recurring-event-horizon: ${RELAY_RECURRING_EVENT_HORIZON:P6M}
  # `calendars` is deliberately left empty here so the application starts cleanly with
  # zero source calendars configured (e.g. in CI). Real deployments supply their own
  # calendar list, one entry per private source calendar, via an external config file
  # (mounted YAML overriding `relay.calendars`, or `SPRING_CONFIG_ADDITIONAL_LOCATION`).
  # Shape of one entry (see README.md "Konfiguration" for the full field table):
  #
  # calendars:
  #   - id: personal-nextcloud                 # persistence key -- never rename once events have been relayed under it
  #     caldav-url: https://cloud.example.com/remote.php/dav/calendars/user/personal/
  #     caldav-username: ${CALDAV_PERSONAL_USERNAME}
  #     caldav-password: ${CALDAV_PERSONAL_PASSWORD}
  #     organizer-email: ${RELAY_PERSONAL_ORGANIZER_EMAIL}
  #     attendee-email: ${RELAY_PERSONAL_ATTENDEE_EMAIL}
  #     from-address: ${RELAY_PERSONAL_FROM_ADDRESS}
  #     reply-to-address: ${RELAY_PERSONAL_REPLY_TO_ADDRESS}
