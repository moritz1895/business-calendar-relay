spring:
  mail:
    host: localhost
    port: 2525
    username: test-smtp-user
    password: test-smtp-password
  datasource:
    url: jdbc:h2:mem:relay-context-startup-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

relay:
  poll-interval: 1h
  calendars:
    - id: calendar-one
      caldav-url: https://caldav.example.com/calendars/one/
      caldav-username: user-one
      caldav-password: password-one
      organizer-email: organizer-one@example.com
      attendee-email: business@example.com
      from-address: relay@example.com
      reply-to-address: organizer-one@example.com
    - id: calendar-two
      caldav-url: https://caldav.example.com/calendars/two/
      caldav-username: user-two
      caldav-password: password-two
      organizer-email: organizer-two@example.com
      attendee-email: business@example.com
      from-address: relay@example.com
      reply-to-address: organizer-two@example.com
