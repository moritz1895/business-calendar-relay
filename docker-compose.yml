services:
  app:
    build: .
    # Fixed, explicit tag (not the default folder-derived name docker compose would pick)
    # so build-and-export-image.sh produces a stable, predictable artifact regardless of
    # which directory this file is copied into.
    image: business-calendar-relay:latest
    ports:
      - "8080:8080"
    environment:
      # Hostname des SMTP-Relais für ausgehende iMIP-Mails (BlockerSink).
      # Kein Default -- erforderlich, siehe .env.example.
      SMTP_HOST: ${SMTP_HOST}
      # SMTP-Port. Implizites TLS ("SMTP + SSL/TLS"), nicht STARTTLS -- siehe
      # application.yml. Default: 465
      SMTP_PORT: ${SMTP_PORT:-465}
      # SMTP-Benutzername. Kein Default -- erforderlich, siehe .env.example.
      SMTP_USERNAME: ${SMTP_USERNAME}
      # SMTP-Passwort. Kein Default -- erforderlich, siehe .env.example.
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # Verzeichnis der eingebetteten, dateibasierten H2-Datenbank hinter StateStore.
      # Fest auf /app/data gesetzt (passend zum "./data"-Bind-Mount unten) --
      # anders als die übrigen Variablen hier bewusst nicht aus .env befüllt, da der
      # Pfad *innerhalb* des Containers liegt, nicht auf dem Host. Anwendungsseitiger
      # Default (außerhalb von Docker, z. B. bei "mvn spring-boot:run"): ./data
      STATE_STORE_DATA_DIR: /app/data
      # Intervall, in dem jeder konfigurierte Quellkalender abgefragt wird
      # (Spring-Duration-Syntax, z. B. 5m, 300s). Default: 5m
      RELAY_POLL_INTERVAL: ${RELAY_POLL_INTERVAL:-5m}
      # Wie weit ein Vorkommen eines wiederkehrenden Quelltermins in der Zukunft
      # liegen darf, um noch erstmals als Blocker angelegt zu werden -- gilt
      # einheitlich für jeden konfigurierten Quellkalender (ISO-8601-Period-Syntax,
      # z. B. P6M, P90D). Einzeltermine sind davon nicht betroffen. Default: P6M
      RELAY_RECURRING_EVENT_HORIZON: ${RELAY_RECURRING_EVENT_HORIZON:-P6M}
      # Wie viele Erstanlagen pro RELAY_INITIALIZATION_BURST_INTERVAL beim einmaligen
      # Initialisieren eines Quellkalenders höchstens verschickt werden dürfen --
      # postfachweit, über alle konfigurierten Quellkalender zusammengerechnet, keine
      # Pro-Kalender-Einstellung. Wirkt ausschließlich auf die einmalige
      # Erstinitialisierung. Default: 5
      RELAY_INITIALIZATION_BURST_SIZE: ${RELAY_INITIALIZATION_BURST_SIZE:-5}
      # Fenstergröße des Sendebudgets aus RELAY_INITIALIZATION_BURST_SIZE
      # (Spring-Duration-Syntax, z. B. PT1H, 30m) -- ebenfalls postfachweit und
      # global. Default: PT1H
      RELAY_INITIALIZATION_BURST_INTERVAL: ${RELAY_INITIALIZATION_BURST_INTERVAL:-PT1H}
      # Uniform iMIP identity -- applies to every configured calendar, regardless of its
      # type (relay.organizer-email/attendee-email/from-address/reply-to-address).
      # Deliberately no per-calendar override any more (see
      # docs/features/relay-config-consolidation.md) -- a single set, required, no
      # default.
      RELAY_ORGANIZER_EMAIL: ${RELAY_ORGANIZER_EMAIL}
      RELAY_ATTENDEE_EMAIL: ${RELAY_ATTENDEE_EMAIL}
      RELAY_FROM_ADDRESS: ${RELAY_FROM_ADDRESS}
      RELAY_REPLY_TO_ADDRESS: ${RELAY_REPLY_TO_ADDRESS}
      # One CalDAV source calendar's credentials, referenced from
      # config/relay-calendars.yml (see config/relay-calendars.yml.example). Add one
      # differently-named block per additional CalDAV calendar (matching a second entry
      # in that file), same as documented in .env.example. Neither variable below has a
      # default -- both required once referenced from config/relay-calendars.yml. A
      # type: google calendar entry instead references relay.google-credentials[] --
      # add one GOOGLE_<NAME>_CLIENT_ID/_CLIENT_SECRET/_REFRESH_TOKEN block the same way
      # once you configure one (see .env.example).
      # CalDAV-Basic-Auth-Benutzername für den Quellkalender.
      CALDAV_PERSONAL_USERNAME: ${CALDAV_PERSONAL_USERNAME}
      # CalDAV-Basic-Auth-Passwort für den Quellkalender.
      CALDAV_PERSONAL_PASSWORD: ${CALDAV_PERSONAL_PASSWORD}
      # Bindet config/relay-calendars.yml (siehe Volume-Mount unten) als zusätzliche,
      # überschreibende Spring-Konfigurationsquelle ein -- das ist der Ort, an dem
      # relay.calendars tatsächlich befüllt wird. Fester Pfad, kein Default nötig,
      # nicht aus .env befüllt.
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/app/config/relay-calendars.yml
    volumes:
      # Bind mount, not a named volume: the embedded H2 database (relay-state.mv.db and
      # friends) needs to be a plain, directly visible file on the host -- e.g. to scp/rsync
      # StateStore/CalendarReplicaStore/PendingCreationQueue state between a real deployment
      # and a local test environment, avoiding "everything looks new" duplicate-mail
      # incidents when testing against a fresh, empty database. A named volume hides this
      # inside Docker-internal storage instead. Create ./data once, owned by uid:gid 10001
      # (see Dockerfile) before the very first start: mkdir -p data && sudo chown 10001:10001 data
      - ./data:/app/data
      # Real source-calendar list -- copy config/relay-calendars.yml.example to
      # config/relay-calendars.yml (git-ignored) and fill in real calendar entries
      # before starting. Must exist as a file (not a directory) before `docker compose
      # up`, otherwise Docker creates an empty directory in its place.
      - ./config/relay-calendars.yml:/app/config/relay-calendars.yml:ro
    restart: unless-stopped
