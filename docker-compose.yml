services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      STATE_STORE_DATA_DIR: /app/data
    volumes:
      - relay-state-data:/app/data
    restart: unless-stopped

volumes:
  relay-state-data:
